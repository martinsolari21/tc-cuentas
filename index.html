<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181c">
<title>TC Cuentas · Turismo Carretera</title>
<meta name="description" content="Cuentas del equipo de Turismo Carretera. Funciona sin señal.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TC Cuentas">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="brand"><span class="flag" aria-hidden="true"></span>TC <span>Cuentas</span></div>
    <div class="top"></div>
  </div>
</header>
<div class="w">
  <nav class="teams" aria-label="Equipos">
    <div class="chips" id="tb"></div>
    <details class="addteam">
      <summary>+ Equipo</summary>
      <div class="row"><input id="tn" placeholder="Nuevo equipo (ej: Equipo Ford)"><input id="tp" placeholder="Piloto (opcional)"><button class="p" data-act="addTeam">Agregar equipo</button></div>
    </details>
  </nav>
  <main id="main"></main>
</div>
<div id="sheet"></div>
<button class="fab" id="fab" data-act="openSheet" aria-label="Nuevo movimiento" hidden><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="bottomnav" id="bottom" aria-label="Secciones" hidden></nav>
<script type="module">import { start } from "./src/main.js"; start();</script>
</body>
</html>
